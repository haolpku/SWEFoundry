schema_version = "1.3"
multi_step_reward_strategy = "final"
artifacts = ["/app/workspace"]

[task]
name = "terminal-data-factory/mini-posix-manifest-installer"
description = "Build Atomic Filesystem Manifest Installer as an offline, deterministic Python system in five progressive implementation steps."
authors = [{ name = "Terminal Data Factory Team" }]
keywords = ["filesystem deployment and rollback", "greenfield", "multi-step"]

[[steps]]
name = "1-validate-deployment-manifest"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "2-plan-atomic-install-operations"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "3-write-and-replay-intent-records"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "4-plan-rollback-from-manifest"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "5-integrated-safe-install-audit"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[metadata]
difficulty = "uncalibrated-long-horizon-candidate"
calibration_status = "target-agent-rollouts-required"
language = "python"
domain = "filesystem deployment and rollback"
codebase_profile = "greenfield"
trajectory_shape = "five-step-progressive-greenfield"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 40000.0
max_steps = 500

[environment]
build_timeout_sec = 300.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
allow_internet = false
workdir = "/app/workspace"
