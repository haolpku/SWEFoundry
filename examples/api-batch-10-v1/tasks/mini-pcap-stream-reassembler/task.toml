schema_version = "1.3"
multi_step_reward_strategy = "final"
artifacts = ["/app/workspace"]

[task]
name = "terminal-data-factory/mini-pcap-stream-reassembler"
description = "Build Classic PCAP TCP Stream Reassembler as an offline, deterministic Python system in five progressive implementation steps."
authors = [{ name = "Terminal Data Factory Team" }]
keywords = ["packet capture forensics", "greenfield", "multi-step"]

[[steps]]
name = "1-parse-classic-pcap-records"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "2-decode-ethernet-ipv4-tcp"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "3-reassemble-tcp-streams"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "4-emit-deterministic-timeout-events"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "5-integrated-pcap-audit-recovery"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[metadata]
difficulty = "uncalibrated-long-horizon-candidate"
calibration_status = "target-agent-rollouts-required"
language = "python"
domain = "packet capture forensics"
codebase_profile = "greenfield"
trajectory_shape = "five-step-progressive-greenfield"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 40000.0
max_steps = 500

[environment]
build_timeout_sec = 300.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
allow_internet = false
workdir = "/app/workspace"
