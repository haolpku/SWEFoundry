schema_version = "1.3"
multi_step_reward_strategy = "final"
artifacts = ["/app/workspace"]

[task]
name = "terminal-data-factory/mini-crdt-notebook-engine"
description = "Build CRDT Notebook Operation Merge and Compaction Engine as an offline, deterministic Python system in five progressive implementation steps."
authors = [{ name = "Terminal Data Factory Team" }]
keywords = ["collaborative document synchronization", "greenfield", "multi-step"]

[[steps]]
name = "1-parse-immutable-operations"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "2-validate-causal-dag"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "3-merge-notebook-text-deterministically"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "4-compute-frontiers-and-compaction-plan"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[[steps]]
name = "5-integrated-notebook-recovery-and-migration"
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 7200.0

[metadata]
difficulty = "uncalibrated-long-horizon-candidate"
calibration_status = "target-agent-rollouts-required"
language = "python"
domain = "collaborative document synchronization"
codebase_profile = "greenfield"
trajectory_shape = "five-step-progressive-greenfield"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 40000.0
max_steps = 500

[environment]
build_timeout_sec = 300.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
allow_internet = false
workdir = "/app/workspace"
