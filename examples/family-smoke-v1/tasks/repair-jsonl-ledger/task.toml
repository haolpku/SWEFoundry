schema_version = "1.3"
artifacts = ["/app/workspace"]

[task]
name = "swefoundry/repair-jsonl-ledger"
description = "Repair a deterministic JSONL event ledger implementation."
authors = [{ name = "SWEFoundry" }]
keywords = ["synthetic-repair", "python", "jsonl"]

[metadata]
family = "synthetic-repair"
language = "python"
difficulty = "smoke"
reward_type = "test_fraction"
provenance = "synthetic"

[verifier]
timeout_sec = 60.0
environment_mode = "shared"
network_mode = "no-network"

[agent]
timeout_sec = 900.0
max_steps = 80

[environment]
build_timeout_sec = 120.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
workdir = "/app/workspace"
