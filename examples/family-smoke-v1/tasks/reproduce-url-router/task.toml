schema_version = "1.3"
artifacts = ["/app/workspace"]

[task]
name = "swefoundry/reproduce-url-router"
description = "Reproduce a deterministic URL router from its API contract and black-box examples."
authors = [{ name = "SWEFoundry" }]
keywords = ["repo-reproduction", "python", "routing"]

[metadata]
family = "repo-reproduction"
language = "python"
difficulty = "smoke"
reward_type = "test_fraction"
provenance = "synthetic-oracle"

[verifier]
timeout_sec = 60.0
environment_mode = "shared"
network_mode = "no-network"

[agent]
timeout_sec = 1200.0
max_steps = 100

[environment]
build_timeout_sec = 120.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
network_mode = "no-network"
workdir = "/app/workspace"
