name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - name: Verify example integrity
        working-directory: examples/api-batch-10-v1
        run: sha256sum --check MANIFEST.sha256
