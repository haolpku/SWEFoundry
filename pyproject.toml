[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-data-factory"
version = "0.2.0"
description = "Unified infrastructure for verifiable coding tasks, Harbor rollouts, rewards, and trajectories"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tdf = "terminal_data_factory.cli:main"
swef = "terminal_data_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
