[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-data-factory"
version = "0.1.0"
description = "Portable task authoring and QA factory with Harbor execution and optional Nexus adapters"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tdf = "terminal_data_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
